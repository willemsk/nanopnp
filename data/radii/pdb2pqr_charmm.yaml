# CHARMM van der Waals radii (Rmin/2, angstrom) by residue and atom name, for the stage-2
# density kernel `gaussian_vdw` (SPECIFICATION.md section 5.3.1 NOTE on geometry.density).
#
# Transcribed verbatim from PDB2PQR 3.7.1, pdb2pqr/dat/CHARMM.DAT, whose header reads
# "Radius and epsilon from par_all27_prot_na.prm". Every radius is the file's own column 4,
# as printed; charges and atom types are not carried. Two residues (CAL, DUM) are listed twice
# in the source with identical entries and appear once here. The author ruled on 25 September
# 2026 that these are the density map's radii: they are the set carried by the per-frame PQR
# files of the reference ensemble (.knowledge/04-clya-geometry-and-charge.md section 1.1).
# tests/tier1/test_density.py::test_ver49_radius_table_matches_charmm_dat holds this file
# equal to the installed CHARMM.DAT, entry by entry.
#
# The lookup rules (the histidine names, the atom aliases and the terminal patches) are data
# too, below the notice; nanopnp.density.radii applies them in the order of WP19 D3.

schema: nanopnp/radii/v1
name: pdb2pqr_charmm
source:
  file: pdb2pqr/dat/CHARMM.DAT
  package: pdb2pqr
  version: 3.7.1
  sha256: f04c4bc285c1fa405915ea4bf85c2b906e1cdcf660840a8cb52047ba62531bc4
  licence: BSD-3-Clause
  notice: >-
    Copyright (c) 2002-2024, Jens Erik Nielsen; Nathan A. Baker; Battelle Memorial Institute,
    Developed at the Pacific Northwest National Laboratory, operated by Battelle Memorial
    Institute, Pacific Northwest Division for the U.S. Department Energy.; Paul Czodrowski &
    Gerhard Klebe, University of Marburg. All rights reserved. Redistributed under the
    BSD-3-Clause licence; the full text is in packaging/LICENSES-BUNDLE.md.
units: angstrom
quantity: Rmin/2
rules:
  # WP19 D3 (1): the histidine names PDB2PQR and AMBER use, read as CHARMM's.
  residue_aliases: {HID: HSD, HIE: HSE, HIP: HSP}
  # D3 (2): a residue name standing for several CHARMM residues; an atom resolves only
  # where every one of them that names it gives the same radius.
  ambiguous: {HIS: [HSD, HSE, HSP]}
  # D3 (3): atom names the PDB uses where CHARMM uses another. '*' is every residue.
  atom_aliases: {ILE: {CD1: CD}, '*': {OXT: OT2}}
  # D3 (4): the terminal patch residues an atom the residue lacks is looked up in. '*' is
  # every residue not listed; the N-terminal patch of glycine and proline is their own.
  patches: {'*': [NTER, CTER], GLY: [GLYP, CTER], PRO: [PROP, CTER]}
