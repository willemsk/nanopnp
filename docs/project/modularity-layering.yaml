# The accepted subpackage import relation of src/nanopnp (WP35 D6; VER-61).
#
# One row per subpackage edge: `from` imports `to`. `relation` is `static` (an import
# at module scope, inside a function or under `if TYPE_CHECKING:`) or `string` (a
# string constant naming the module, as the stage registry and PUBLIC do). `finding`
# names the MOD-nn of docs/project/modularity-findings.md that bears on the edge, or
# is null. tests/tier1/test_layering.py asserts that this list equals the relation
# nanopnp.validation.modularity measures, in both directions: a commit that adds or
# removes an edge edits this file in the same commit (docs/project/contributing.md).
#
# `finding` follows the order the report reads the layers in, lowest first: core,
# structure, density, symmetry, geometry, mesh, charge, materials, physics, solve,
# post, io, sweep, validation, cli, gui, nanopnp. An edge pointing up that order is
# annotated with the finding that explains it.
