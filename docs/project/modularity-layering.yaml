# The accepted subpackage import relation of src/nanopnp (WP35 D6; VER-61), the
# recorded upward edges (VER-61, section 8.2.8 H11, H12) and the subpackages that reach
# the finite-element backend (VER-65, section 8.2.8 H3).
#
# `edges`: one row per subpackage edge: `from` imports `to`. `relation` is `static`
# (an import at module scope, inside a function or under `if TYPE_CHECKING:`) or
# `string` (a string constant naming the module, as the stage registry, PUBLIC and
# the exit-code table of core/errors.py do). `finding` names the MOD-nn of
# docs/project/modularity-findings.md or the REV-nn of
# docs/project/review-findings.md that bears on the edge, or is null.
# tests/tier1/test_layering.py asserts that this list equals the relation
# nanopnp.validation.modularity measures, in both directions: a commit that adds or
# removes an edge edits this file in the same commit (docs/project/contributing.md).
#
# The layer order, lowest first, is LAYER_ORDER of nanopnp.validation.modularity:
# core, io, structure, density, symmetry, geometry, mesh, numerics, charge, materials,
# physics, solve, post, pipeline, sweep, validation, cli, gui, nanopnp. `io` is the
# base, which imports only core and io at module scope; `pipeline` is the assembler
# (section 5.1). An edge pointing up that order is annotated with the finding that
# explains it: io's annotation-only imports of the electrolyte, the Newton settings
# and the model declaration are MOD-04's, and core's of the stage-input types is
# MOD-15's.
#
# `upward`: every edge of `top` imports (at module scope, outside TYPE_CHECKING)
# that points up the layer order. The static relation does not change when an
# import moves under TYPE_CHECKING, so this list is what keeps a cut from coming
# back. tests/tier1/test_layering.py asserts it equals the measured upward edges in
# both directions.
#
# `deferred_upward`: the same ratchet over imports inside a function, which are
# no cut (WP37 D12) and which the static relation cannot tell from the
# TYPE_CHECKING import they may replace (section 8.2.8 H12). Every upward edge in
# either list names its finding, and both lists only shrink.
#
# `backend`: the subpackages with a module that imports ngsolve or netgen in any
# kind, or names one of their submodules in a string. tests/tier1/test_backend_guard.py
# asserts it equals the live set in both directions (QR-13): a new subpackage
# reaching the backend is a decision recorded here, and one that stops reaching it
# shrinks the record.
