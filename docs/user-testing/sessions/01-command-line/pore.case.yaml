# The case of session 01: an uncharged cylindrical pore in 0.1 M NaCl at +50 mV, with the
# validated ePNP-NS model. `geometry.pore` is meshed by stage 6 under `numerics.mesh`.
schema: nanopnp/case/v0.5
name: pore

geometry:
  pore: {shape: cylinder, radius_nm: 2}
  membrane: {thickness_nm: 6}
  reservoir: {radius_nm: 10}

electrolyte:
  species: [{name: Na+, z: +1}, {name: Cl-, z: -1}]
  concentration_M: 0.1
  temperature_K: 298.15
  parameters: willems2020_nacl
  corrections:
    diffusivity:  {model: willems2020_nacl}
    mobility:     {model: willems2020_nacl}
    viscosity:    {model: willems2020_nacl}
    permittivity: {model: willems2020_nacl}
    density:      {model: willems2020_nacl}
    steric:       {model: borukhov}

boundary_conditions:
  bias_V: 0.05
  ground: cis

physics:
  model: epnp-ns
  solid_permittivities: {membrane: 3.2}

numerics:
  continuation: default_ladder
  stabilisation: none
  mesh: {maxh_nm: 4, wall_h_nm: 0.35}

outputs: [current, transport_numbers, eof_rate]
