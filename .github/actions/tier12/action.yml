name: Tiers 1 and 2
description: >-
  The steps of the `platforms` and `full-matrix` jobs of ci.yml (section 7.6;
  section 8.2.13 N4): install uv, the system libraries and the extras, then
  run Tiers 1 and 2 (with --nightly, and --slow for the slow tests, when asked), then the
  installation's self-test. The checkout and the job's environment stay in the job.
inputs:
  python-version:
    description: The interpreter to run on.
    required: true
  code:
    description: "'true' when the change is not prose-only; otherwise every step is skipped."
    required: true
  nightly:
    description: "'true' to add the `nightly` walks and the `slow` tests to the per-push selection."
    default: "false"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      if: inputs.code == 'true'
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}
    - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
      if: inputs.code == 'true' && runner.os == 'Linux'
      with:
        packages: ${{ env.GMSH_APT_PACKAGES }}
        version: "1"
    - if: inputs.code == 'true'
      shell: bash
      run: uv sync --all-extras
    - if: inputs.code == 'true'
      shell: bash
      run: |
        run=(uv run pytest -rs --durations=20 -n auto --dist loadfile)
        status=0
        if [[ $NIGHTLY == true ]]; then
          "${run[@]}" --slow -m "(tier1 or tier2) and slow" || status=$?
          run+=(--nightly)
        fi
        "${run[@]}" || status=$?
        exit $status
      env:
        NIGHTLY: ${{ inputs.nightly }}
    # The installation's self-test (RSK-13): each compiled payload, and the server's renderer.
    - if: inputs.code == 'true'
      shell: bash
      run: uv run nanopnp gui --selftest
