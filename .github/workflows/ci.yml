# Tiers 1 and 2 on every push (SPECIFICATION.md section 7.6). Tier 3 is nightly,
# recorded and not gated, and is the `tier3` job below. Tier 4 gates releases and
# has no job yet: there are no experimental fixtures to run it against.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 02:30 UTC, nightly. Section 7.1: Tier 3 runs "once Tier 2 passes", which the
    # push gate establishes; this is the recording run, not a second gate.
    - cron: "30 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"        # fail if uv.lock is out of date rather than silently resolving

jobs:
  check:
    name: lint, types, tier 1-2 (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/
      - run: uv run pytest --cov=src/nanopnp --cov-report=term-missing

  test-matrix:
    name: tier 1-2 (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # QR-09: binary wheels on Windows, macOS and Linux for 3.10-3.14.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # CON-13: the desktop platforms, on the development pin.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run pytest

  # Tier 3 is RECORDED, NOT GATED (section 7.1, section 7.6): `continue-on-error`
  # is the whole point, and removing it would make a per-cent-level discrepancy
  # against a different discretisation on a different mesh fail the build. The
  # acceptance targets of section 7.4 become a gate in Phase 4, and only once both
  # of that section's preconditions hold.
  #
  # The goldens are named and never vendored (section 7.1 NOTE): five cases x six
  # fields x five patches x two refinements is not a repository file. Where
  # $NANOPNP_REFERENCE_DATA is unset or lacks a golden, every Tier-3 test SKIPS --
  # visibly, in the uploaded report -- because an unavailable reference is missing
  # evidence and not a defect. A job that failed on an absent archive would make
  # the tier unrunnable off the machine that holds it.
  tier3:
    name: COMSOL comparison (nightly, recorded not gated)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Unset here, and set on a runner that mounts the archive. The tests skip
      # without it; `nanopnp --env` reports which it found.
      NANOPNP_REFERENCE_DATA: ${{ vars.NANOPNP_REFERENCE_DATA }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run nanopnp --env
      - run: uv run pytest -m tier3 -v --junitxml=tier3-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier3-report
          path: |
            tier3-report.xml
            **/*.attribution.json
            **/*.attribution.md
          if-no-files-found: warn
