# What CI runs, and when (SPECIFICATION.md section 7.6; section 8.2.13 N4):
#
# - a pull request: one ubuntu leg on Python 3.14. `lint`, `docs`, the per-push
#   selection as two shards (Tier 1, Tier 2), and `CI result`, the one required check;
# - a push to `main`: the per-push selection on the three platforms, and the bundle.
#   A dispatch without `full` runs the same, and Tier 3;
# - nightly: Tiers 1 and 2 with `--nightly` and the `slow` tests on the three
#   platforms, Python 3.14, and the bundle, as the probe of the runner images' drift;
#   Tier 3, and Tier 1 on Python 3.11 to 3.13 on the three platforms from wheels,
#   recorded and not gated. A failed night opens an issue and blocks nothing;
# - `full: true` (a dispatch, or `release.yml` before it builds a tag): Tiers 1 and
#   2 with `--nightly` and the `slow` tests on the three platforms and Python 3.11
#   to 3.14, and Tier 3. Tier 4 has no job yet: there are no experimental fixtures.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "The release matrix: three platforms, Python 3.11-3.14, --nightly"
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      ref:
        description: "The ref to test; the caller's commit when empty"
        type: string
        default: ""
  schedule:
    # 02:30 UTC, nightly. Section 7.1: Tier 3 runs "once Tier 2 passes", which the
    # push gate establishes; this is the recording run, not a second gate.
    - cron: "30 2 * * *"

# The nightly run takes hours (it adds the `slow` tests), so a push to `main` neither
# cancels it nor shares its group.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event_name == 'schedule' && 'night-' || '' }}${{ github.ref }}-${{ inputs.ref || '' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  # Fail if uv.lock no longer matches pyproject.toml. UV_LOCKED asserts that;
  # UV_FROZEN would only skip re-locking and install the stale lock as it stands.
  UV_LOCKED: "1"
  # pytest runs as `-n auto --dist loadfile` with one BLAS thread per worker.
  # Serially the BLAS threads buy no wall time on this suite; under xdist they
  # oversubscribe the cores: 6m10s serial, 7m20s unpinned, 3m19s pinned on
  # four cores (knowledge/07-software-stack/index.md). The commit gate does the same.
  # tests/tier1/test_gui_widgets.py is the exception and runs serially, alone,
  # on the desktop runners where it runs at all (on ubuntu PySide6 does not
  # import and the module skips itself). It waits on a real QtWebEngine page by
  # the wall clock, and with every core busy with a solver in another worker
  # Chromium's helper processes missed its 60 s on a 3-core macOS runner (run
  # 113), where they never had serially.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  # NumPy's runtime SIMD dispatch, capped at X86_V3 (AVX2): above it, last-bit
  # differences in the structure -> contour stages move a PDB-derived mesh, so
  # the hosted fleet's AVX-512 and AVX2 machines would deploy different meshes.
  # Capped, every x86-64 leg deploys the mesh of VER-62's reference environment
  # (src/nanopnp/validation/stability.py; knowledge/06-numerics-fem/09-ngsolve-traps-found-by-implementing.md#815-within-one-build-a-deployed-walks-quantities-repeat-bit-for-bit). Names a
  # platform does not dispatch are ignored, so the arm64 legs are unaffected.
  NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
  # Every pytest call below passes -rs, so each skip is listed with its reason:
  # a skip is missing evidence, and an unnamed one cannot be audited (WP23 D11).
  # The optional Gmsh backend's tests FAIL rather than skip on every leg
  # (tests/conftest.py): a backend whose every test can skip is untested. The
  # ubuntu jobs install the X and GL libraries the gmsh wheel loads at import.
  NANOPNP_REQUIRE_GMSH: "1"
  # VAL-06 runs APBS from the test-only `apbs` group, whose apbs-binary wheel
  # exists for Linux x86_64 and macOS only (WP29 D11). Its tests FAIL rather than
  # skip where the variable is 1, which is every leg but Windows; Windows has no
  # wheel and skips them by name (WP29 D12, the WP23 D11 rule).
  NANOPNP_REQUIRE_APBS: "1"
  # The packages the gmsh wheel loads at import; it raises OSError without them
  # (knowledge/07-software-stack/04-geometry-meshing-and-io.md; WP23 D11). Installed through a
  # cache, so a warm runner skips apt.
  GMSH_APT_PACKAGES: libglu1-mesa libxft2 libxinerama1 libxcursor1

# Every checkout that installs the package fetches the whole history
# (`fetch-depth: 0`): hatch-vcs derives the version from the nearest tag
# (SPECIFICATION.md section 2.7, Versioning), and a depth-1 clone has none in
# reach, so the manifest would record a meaningless version. Every checkout names
# `inputs.ref`, which is empty except when `release.yml` calls this workflow.
jobs:
  # What this run is, and whether it touches anything but prose.
  #
  # `mode` is `pr`, `main` (a push to main, or a dispatch without `full`), `full`
  # (`full: true`, dispatched or called) or `nightly`. Under `workflow_call` the
  # event is the caller's, so `full` is read before the event.
  #
  # `code` is false for a prose-only change (the rule is
  # .github/scripts/prose-only.sh, which the commit gate uses too): the jobs below
  # still run and report success, and only their steps are skipped. A schedule, a
  # dispatch, a call or a push with no usable base is always code.
  #
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          REF: ${{ github.ref }}
        run: |
          if [[ $FULL == true ]]; then mode="full"
          elif [[ $EVENT == pull_request ]]; then mode="pr"
          elif [[ $EVENT == schedule ]]; then mode="nightly"
          elif [[ $EVENT == workflow_dispatch || $REF == refs/heads/main ]]; then mode="main"
          else
            echo "::error::no CI mode for event $EVENT on $REF"
            exit 1
          fi
          echo "mode=$mode" | tee -a "$GITHUB_OUTPUT"
      - id: diff
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case $MODE in
            pr) range="$PR_BASE...$PR_HEAD" ;;
            main) [[ $EVENT == push ]] && range="$PUSH_BEFORE..$PUSH_AFTER" || range="" ;;
            *) range="" ;;
          esac
          code=true
          if [[ -n $range && $range != 0000000000000000000000000000000000000000* ]] &&
              files=$(git diff --name-only "$range"); then
            printf '%s\n' "$files"
            printf '%s\n' "$files" | .github/scripts/prose-only.sh && code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # Lint and types. The `apbs` group is a test dependency only. A job that syncs
  # less than the default groups runs `uv run --no-sync`, or `uv run` would sync
  # them back.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.mode != 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        if: env.CODE == 'true'
        with:
          enable-cache: true
          python-version: "3.14"
      - if: env.CODE == 'true'
        run: uv sync --all-extras --no-group apbs
      - if: env.CODE == 'true'
        run: uv run --no-sync ruff check .
      - if: env.CODE == 'true'
        run: uv run --no-sync ruff format --check .
      - if: env.CODE == 'true'
        run: uv run --no-sync mypy src/

  # VER-45's strict documentation build (section 7.6). Its steps run on EVERY
  # push, prose-only ones included, and so read no `code`: a broken link is
  # exactly what a prose-only edit introduces. The generated pages are rendered
  # first, from the live schema, parser and exit enumeration.
  docs:
    name: documentation (strict build)
    needs: changes
    if: needs.changes.outputs.mode != 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --no-default-groups --group docs
      - run: uv run --no-sync docs/scripts/generate.py
      - run: uv run --no-sync mkdocs build --strict

  # A pull request's tests: the per-push selection (Tiers 1 and 2 without the
  # `nightly` walks; section 8.2.13 N4), in two shards: Tier 1 and Tier 2,
  # selected by marker, so they partition the selection.
  tests:
    name: tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.mode == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [tier1, tier2]
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        if: env.CODE == 'true'
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        if: env.CODE == 'true'
        with:
          packages: ${{ env.GMSH_APT_PACKAGES }}
          version: "1"
      - if: env.CODE == 'true'
        run: uv sync --all-extras
      - if: env.CODE == 'true'
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          start=$SECONDS
          status=0
          uv run pytest -rs -n auto --dist loadfile --ignore=tests/tier1/test_gui_widgets.py \
            -m "$SHARD and not slow" || status=$?
          echo "### tests ($SHARD): $((SECONDS - start)) s, pytest exit $status" \
            >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # The one required check of a pull request. It fails unless every job it needs
  # succeeded: a skipped job fails it too, so a condition that skipped a leg can
  # never pass for one that ran.
  ci-result:
    name: CI result
    needs: [changes, lint, docs, tests]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [[ -n $failed ]]; then
            echo "::error::not every job succeeded: $failed"
            exit 1
          fi

  # After a merge, and nightly: Tiers 1 and 2 on the three platforms, Python 3.14
  # (CON-13; section 8.2.13 N4). A push to main runs the per-push selection; the
  # nightly run adds the `nightly` walks and the `slow` tests.
  platforms:
    name: tier 1-2 (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.mode == 'main' || needs.changes.outputs.mode == 'nightly'
    runs-on: ${{ matrix.os }}
    # The nightly leg runs the `slow` tests too: example 05's frozen solve alone took
    # 2,512 s on one core and its test allows 7,200 s.
    timeout-minutes: ${{ needs.changes.outputs.mode == 'nightly' && 240 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]
    env:
      NANOPNP_REQUIRE_APBS: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/tier12
        with:
          python-version: ${{ matrix.python-version }}
          code: ${{ needs.changes.outputs.code }}
          nightly: ${{ needs.changes.outputs.mode == 'nightly' }}

  # Before a release (`full: true`): Tiers 1 and 2 with --nightly on the three
  # platforms and every supported Python (QR-09, CON-13; section 7.6). The steps
  # are the `platforms` job's: the composite action .github/actions/tier12.
  full-matrix:
    name: full tier 1-2 (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    # Runs the `slow` tests (nightly: "true" below); see the `platforms` job's timeout.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      NANOPNP_REQUIRE_APBS: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/tier12
        with:
          python-version: ${{ matrix.python-version }}
          code: ${{ needs.changes.outputs.code }}
          nightly: "true"

  # QR-09's evidence for Python 3.11 to 3.13 between releases: each installs its
  # dependencies from wheels alone and runs Tier 1. RECORDED, NOT GATED (section
  # 8.2.10 J4). UV_NO_BUILD is set on the dependency step only, so a missing wheel
  # fails rather than compiles (CON-07): uv refuses it for the project itself,
  # whose editable install is a pure-Python hatchling build.
  nightly:
    name: nightly tier 1 (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      NANOPNP_REQUIRE_APBS: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        if: runner.os == 'Linux'
        with:
          packages: ${{ env.GMSH_APT_PACKAGES }}
          version: "1"
      - run: uv sync --all-extras --no-install-project
        env:
          UV_NO_BUILD: "1"
      - run: uv sync --all-extras
      - run: >-
          uv run pytest -rs -n auto --dist loadfile --ignore=tests/tier1/test_gui_widgets.py
          -m "tier1 and not slow"
        env:
          QT_QPA_PLATFORM: offscreen

  # A failed night opens one issue naming the failed jobs and the run; it blocks
  # nothing (section 8.2.13 N4). The recorded legs are `continue-on-error`, so a
  # failure there is read in the run, not named here.
  nightly-issue:
    name: nightly issue
    needs: [changes, platforms, bundle]
    if: always() && needs.changes.outputs.mode == 'nightly' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')
          gh label create nightly --repo "$REPO" --color ededed 2>/dev/null || true
          gh issue create --repo "$REPO" --label nightly \
            --title "Nightly failed: $(date -u +%F) ${SHA::7}" \
            --body "Failed jobs: $failed. Run: $RUN_URL"

  # RSK-13's continuous detector: desktop packaging defeated by a binary
  # dependency. GATED -- a failed build fails CI, because a probe nobody looks
  # at is amendment A2 again (section 8.2.1 A4). It is demoted to
  # `continue-on-error` only if PyInstaller proves flaky for reasons outside
  # this repository, and that demotion is recorded with the failure that caused
  # it. It runs after a merge, before a release and nightly, as the probe of the
  # runner image's drift.
  #
  # The uploaded artefact is what the author double-clicks; that observation,
  # and not this job's exit code, is what closes section 8.2 criterion 4.
  bundle:
    name: Windows bundle (RSK-13 probe, gated)
    needs: changes
    if: needs.changes.outputs.mode != 'pr'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        if: env.CODE == 'true'
        with:
          enable-cache: true
          python-version: "3.14"
      - if: env.CODE == 'true'
        run: uv sync --all-extras --group packaging
      - if: env.CODE == 'true'
        run: uv run pyinstaller --clean --noconfirm packaging/nanopnp-probe.spec
      # One process importing PySide6, QtWebEngineWidgets, ngsolve, netgen and
      # ngsolve.webgui, constructing a QWebEngineView over a real webgui scene
      # and reading the CON-11 licence notice out of the bundle.
      - if: env.CODE == 'true'
        run: dist/nanopnp-probe/nanopnp-probe.exe --selftest
      - uses: actions/upload-artifact@v7
        if: always() && env.CODE == 'true'
        with:
          name: nanopnp-probe-windows
          path: dist/nanopnp-probe
          # `warn`, as the tier3 upload below does, because this step runs
          # `if: always()`: the only way to reach it with nothing to upload is a
          # build that already failed loudly, and `error` would add a second red
          # step pointing away from it.
          if-no-files-found: warn

  # Tier 3 is RECORDED, NOT GATED (section 7.1, section 7.6): `continue-on-error`
  # is the whole point, and removing it would make a per-cent-level discrepancy
  # against a different discretisation on a different mesh fail the build. The
  # acceptance targets of section 7.4 become a gate in Phase 6, and only once both
  # of that section's preconditions hold.
  #
  # The goldens are named and never vendored (section 7.1 NOTE): five cases x six
  # fields x five patches x two refinements is not a repository file. Where
  # $NANOPNP_REFERENCE_DATA is unset or lacks a golden, every Tier-3 test SKIPS --
  # visibly, in the uploaded report -- because an unavailable reference is missing
  # evidence and not a defect. A job that failed on an absent archive would make
  # the tier unrunnable off the machine that holds it.
  tier3:
    name: COMSOL comparison (recorded not gated)
    needs: changes
    if: >-
      needs.changes.outputs.mode == 'nightly' || needs.changes.outputs.mode == 'full' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      # Unset here, and set on a runner that mounts the archive. The tests skip
      # without it; `nanopnp --env` reports which it found.
      NANOPNP_REFERENCE_DATA: ${{ vars.NANOPNP_REFERENCE_DATA }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.GMSH_APT_PACKAGES }}
          version: "1"
      - run: uv sync --all-extras
      - run: uv run nanopnp --env
      - run: uv run pytest -m tier3 -v -rs --junitxml=tier3-report.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tier3-report
          path: |
            tier3-report.xml
            **/*.attribution.json
            **/*.attribution.md
          if-no-files-found: warn
