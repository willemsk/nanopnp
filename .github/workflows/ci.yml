# Tiers 1 and 2 on every push (SPECIFICATION.md section 7.6). Tier 3 is nightly
# and Tier 4 gates releases; both are stubbed at the bottom until there are
# COMSOL golden files and experimental fixtures to run them against.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"        # fail if uv.lock is out of date rather than silently resolving

jobs:
  check:
    name: lint, types, tier 1-2 (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/
      - run: uv run pytest --cov=src/nanopnp --cov-report=term-missing

  test-matrix:
    name: tier 1-2 (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # QR-09: binary wheels on Windows, macOS and Linux for 3.10-3.14.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # CON-13: the desktop platforms, on the development pin.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run pytest

