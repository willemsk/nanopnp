# The development loop's budgets (SPECIFICATION.md section 7.6 budget NOTE; VER-73).
# J7 of section 8.2.10 pre-registered the first three (the push gate re-set to 600 s, REV-82); WP43 D11 set the file ceiling
# and the margin. Seconds of wall time.
#
# - commit_hook_s: the commit hook, a typical one-module change on 4 cores (J7).
#   Logged by .claude/hooks/gate.sh, never failed on.
# - push_gate_s: `gate.sh run`, 4 cores (J7). Logged, never failed on.
# - pull_request_critical_path_s: a pull request's CI run, from the first job's
#   start to the last measured job's completion (J7, J10). CI's `coverage` job
#   fails a run past this budget by more than the margin.
# - file_ceiling_s: one development-selection test file in CI's junit durations.
#   The hook's wall time is bounded below by its longest selected file, so no file
#   may take longer (WP33 D15's ceiling, made a check).
# - margin: the excess tolerated before a check fails. Same-day reruns of one
#   suite spread by 1.55 to 1.60 on hosted runners (WP43 Design section 5), so a
#   tighter margin would fail on runner noise alone.
commit_hook_s: 60
push_gate_s: 600
pull_request_critical_path_s: 360
file_ceiling_s: 90
margin: 0.5
