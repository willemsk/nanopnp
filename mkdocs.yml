# The documentation site (QR-15, VER-45; WP16 D1-D3).
#
# Material for MkDocs on MkDocs 1.x. Material is in maintenance mode and does not
# support MkDocs 2, so this file stays readable by Zensical, its successor: no
# `hooks:`, and no plugin Zensical has no shim for (.knowledge/07-software-stack.md
# section 13). Generated pages are written by a separate step, never by a hook:
#
#   uv sync --all-extras --group docs   (exact: without --all-extras it drops the extras)
#   uv run docs/scripts/generate.py
#   uv run mkdocs build --strict
site_name: nanopnp
site_description: >-
  Continuum simulation of biological nanopores with the ePNP-NS framework.
site_url: https://nanopnp.readthedocs.io/
repo_url: https://github.com/willemsk/nanopnp
repo_name: willemsk/nanopnp
edit_uri: edit/main/docs/
copyright: nanopnp is BSD-3-Clause licensed.

docs_dir: docs
# Plans are not user material (CLAUDE.md); the build scripts are not pages.
exclude_docs: |
  plans/
  scripts/
  overrides/

theme:
  name: material
  # The site-wide pre-alpha banner (WP16 D2) is the `announce` block of this
  # override; a template, not a build hook.
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            members_order: source
            heading_level: 3
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - guide/index.md
      - Concepts: guide/concepts.md
      - Case files: guide/case-files.md
      - Meshes: guide/meshes.md
      - Charge and permittivity fields: guide/fields.md
      - Running and exit codes: guide/running.md
      - Sweeps and HPC: guide/sweeps.md
      - Outputs and quantities: guide/outputs.md
      - Provenance and deviations: guide/provenance.md
      - Stabilisation modes: guide/stabilisation.md
      - Desktop shell: guide/desktop.md
  - Examples:
      - examples/index.md
      - 01 Quick start: _generated/examples/01-quickstart.md
      - 02 A charged pore: _generated/examples/02-charged-pore.md
      - 03 An I-V sweep: _generated/examples/03-iv-sweep.md
      - 04 The Python API: _generated/examples/04-python-api.md
      - 05 The ClyA reference: _generated/examples/05-clya-reference.md
  - Reference:
      - reference/index.md
      - Case file: _generated/reference/case-file.md
      - Command line: _generated/reference/cli.md
      - Exit codes: _generated/reference/exit-codes.md
      - Python API: _generated/reference/api.md
      - Correction data files: reference/corrections.md
      - Shipped parameter files: _generated/reference/correction-files.md
  - Model:
      - model/index.md
      - Specification: _generated/model/specification.md
      - Knowledge base:
          - Index: _generated/model/knowledge/00-index.md
          - ePNP-NS physics: _generated/model/knowledge/01-physics-epnpns.md
          - Electrokinetics background: _generated/model/knowledge/02-electrokinetics-background.md
          - Nanopore biology: _generated/model/knowledge/03-nanopore-biology.md
          - ClyA geometry and charge: _generated/model/knowledge/04-clya-geometry-and-charge.md
          - Analyte and forces: _generated/model/knowledge/05-analyte-and-forces.md
          - Numerics: _generated/model/knowledge/06-numerics-fem.md
          - Software stack: _generated/model/knowledge/07-software-stack.md
          - Validation benchmarks: _generated/model/knowledge/08-validation-benchmarks.md
          - COMSOL reference settings: _generated/model/knowledge/09-comsol-reference-settings.md
  - Project:
      - project/index.md
      - Contributing: project/contributing.md
      - Citing: project/citing.md
      - Licence: project/licence.md
      - The reference sweep: sweeps/README.md
      - COMSOL export contract: validation/comsol-export-contract.md
