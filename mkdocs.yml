# The documentation site (QR-15, VER-45; WP16 D1-D3).
#
# Material for MkDocs on MkDocs 1.x. Material is in maintenance mode and does not
# support MkDocs 2, so this file stays readable by Zensical, its successor: no
# `hooks:`, and no plugin Zensical has no shim for
# (knowledge/07-software-stack/13-documentation-tooling-mkdocs-material.md). Generated pages are
# written by a separate step, never by a hook:
#
#   uv sync --all-extras --group docs   (exact: without --all-extras it drops the extras)
#   uv run docs/scripts/generate.py
#   uv run mkdocs build --strict
site_name: nanopnp
site_description: >-
  Continuum simulation of biological nanopores with the ePNP-NS framework.
site_url: https://nanopnp.readthedocs.io/
repo_url: https://github.com/willemsk/nanopnp
repo_name: willemsk/nanopnp
edit_uri: edit/main/docs/
copyright: nanopnp is BSD-3-Clause licensed.

docs_dir: docs
# Plans and code-review reports are not user material (CLAUDE.md); the build
# scripts are not pages.
exclude_docs: |
  plans/
  code_reviews/
  superpowers/
  scripts/
  overrides/

theme:
  name: material
  # The site-wide pre-alpha banner (WP16 D2) is the `announce` block of this
  # override; a template, not a build hook.
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            members_order: source
            heading_level: 3
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

