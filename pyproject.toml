[project]
name = "nanopnp"
version = "0.1.0.dev0"
description = "Continuum simulation of biological nanopores with the ePNP-NS framework"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kherim Willems", email = "kherimwillems@gmail.com" }]
keywords = ["nanopore", "electrokinetics", "finite-element", "PNP", "Navier-Stokes"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

# Solver core only (SPECIFICATION.md v0.5). Pipeline stages that are not yet
# implemented keep their dependencies in the extras below, so the default
# install stays small and wheel-only (QR-09, CON-07).
dependencies = [
    "ngsolve>=6.2.2606",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "meshio>=5.3",
    "h5py>=3.10",
]

[project.optional-dependencies]
# Structure -> density -> contour -> charge pipeline (v0.9, phases 2-3).
# Floors are set to the oldest release that still supports Python 3.10, which
# QR-09 requires. On 3.11+ the resolver picks the versions named in
# SPECIFICATION.md section 2.6 (MDAnalysis 2.10, GridDataFormats 1.2); those
# releases dropped 3.10 themselves. If the geometry pipeline comes to need a
# 2.10-only API, the supported floor becomes Python 3.11 and QR-09 must say so.
structure = [
    "MDAnalysis>=2.7",
    "GridDataFormats>=1.0.2",
    "scikit-image>=0.22",
    "shapely>=2.0",
    "pdb2pqr>=3.6",
]
# Desktop shell (ADR-004). PySide6 is LGPL-3; PyQt is forbidden by CON-09.
gui = ["PySide6>=6.7"]
# OPTIONAL MESHER BACKEND ONLY. gmsh is GPLv2+; the default path must never
# import it and the library must stay functional without it (CON-10, ADR-002).
gmsh = ["gmsh>=4.13"]

[project.urls]
Specification = "https://github.com/willemsk/nanopnp/blob/main/SPECIFICATION.md"

[project.scripts]
nanopnp = "nanopnp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanopnp"]

# The correction parameter files live at the repository root (SPECIFICATION.md
# section 11) but must travel inside the wheel; core/paths.py resolves either
# location.
[tool.hatch.build.targets.wheel.force-include]
"data" = "nanopnp/data"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY", "RUF", "D", "ANN"]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "N803",   # physics notation: D0, P1, V_T are the published symbol names
    "N806",
    "N815",   # unit suffixes on attributes are required: validity_M, temperature_K
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "ANN201", "ANN001"]

[tool.mypy]
# The development pin, not the 3.10 support floor: NumPy's shipped stubs use
# `type` statements that only parse under 3.12+. Ruff's target-version = py310
# is what keeps the source itself compatible with the floor.
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true

# Scientific packages with no type information a checker can use: most ship none,
# and NGSolve's stubs are unreachable without a py.typed marker and do not parse
# with one (see src/nanopnp/core/typing.py).
[[tool.mypy.overrides]]
module = [
    "ngsolve.*",
    "netgen.*",
    "MDAnalysis.*",
    "meshio.*",
    "skimage.*",
    "shapely.*",
    "scipy.*",
    "gridData.*",
    "pdb2pqr.*",
    "gmsh",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'tier1 or tier2' --strict-markers --strict-config"
markers = [
    "tier1: unit and property tests, seconds, every push (SPECIFICATION.md section 7.2)",
    "tier2: analytic benchmarks, minutes, every push (section 7.3)",
    "tier3: COMSOL cross-implementation comparison, hours, nightly (section 7.4)",
    "tier4: experimental reproduction, hours, before a tagged release (section 7.5)",
    "slow: takes more than a minute regardless of tier",
]

[tool.coverage.run]
source = ["src/nanopnp"]
