# The dodecamer prepared by example 06's prepare.py, taken to a charged ePNP-NS
# solve. The charge block spells out the protonation keys at their defaults, so
# the manifest lists no deviation: they are the keys you would edit.
#
# The mesh is four times coarser than the default sizes, for runtime only. The
# transport number it gives is a property check, not a prediction.
schema: nanopnp/case/v2
name: 2wcd-charged
structure:
  source: {path: 2wcd-prepared.pdb}
  symmetry: {point_group: C12}
charge: {ph: 7.5, forcefield: CHARMM, titration: propka}
electrolyte:
  species: [{name: Na+, z: +1}, {name: Cl-, z: -1}]
  concentration_M: 0.15
  parameters: willems2020_nacl
  corrections:                     # the validated model: no deviation recorded
    diffusivity:  {model: willems2020_nacl}
    mobility:     {model: willems2020_nacl}
    viscosity:    {model: willems2020_nacl}
    permittivity: {model: willems2020_nacl}
    density:      {model: willems2020_nacl}
    steric:       {model: borukhov}
boundary_conditions: {bias_V: 0.05, ground: cis}
physics: {model: epnp-ns, solid_permittivities: {protein: 20.0, membrane: 3.2}}
numerics:
  mesh: {size_scale: 4.0}          # coarse, for runtime; a discretisation choice
outputs: [current, transport_numbers]
